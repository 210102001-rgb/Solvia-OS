; Solvia.Nova OS — production PHP defaults (baked into image).
; Real secrets (APP_KEY, DB_*) must come from container environment, never baked.
expose_php = Off
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 20M
post_max_size = 24M

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = 1255
opcache.jit_buffer_size = 128M
